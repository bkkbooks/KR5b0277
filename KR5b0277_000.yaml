body:
  text: 又呪曰表氣九回敗魄邪凶天獸守門玉女執關鍊魂柔質與我相守不能妄動看形厚汝汝若飢渴聽入華丹急急如律令第三十百榖之實土地精五味外美邪魔腥但以絶榖除於美味准前修飬胎氣自成真也第三十一心者一體之中立成帝王五臟之主心以清寧萬神之威靈動靜常念前呪之言持於四十九日百神之靈每有事而預先有神人來告此是百靈衛護其丹日有兩朝旦現於頂暮現於臍謂之曰靈丹也第三十二經歷六合卯酉隱成腎是本腎屬水心屬火腎屬北方謂之鉛心屬南方謂之汞水火相成謂之九轉還丹之理也名曰離宫有象象藏真水坎戶含華隱正金也謂之真鉛真汞也第三十三卯者東方青木之氣為之日魂名曰龍隱在離宫酉者西方白金之氣為之月魄名曰虎出在坎位此是返覆之理上合玉泉下合金闕玉泉津金關精兩物隂陽相感在中黃庭內得土之正氣乃成紫金丹還丹畢矣令人延年益壽謂之真人也第三十四但以日飲五華精氣自然成如一株白玉永絶思慮嗜欲而自除要行而意到便到可閉息經千息要坐要卧並無所礙百脉調暢肉蟄體換金玉骨也謂之日鍊形生神道於超凡入聖之理備矣第三十五元陽子命者丹田為其內有一龜常飲中和氣食於日精月華要絶五榖五味心行於德見危者救見厄者扶見自身有禍不要避之其禍立除災不能染害不可躔此是修飬入其真聖謂之真道也第三十六沐浴齊戒入室東向約得萬遍散髮冥目五味皆去真正氣還夷心寂門遍數已畢玉女告子至使六丁拜朝太上後北向曰師授者風羅金劔割髮肌膚登山液丹玉㬌可宣七祖免受冥患言致神仙此是修養機關可以謂祕若欲傳之先觀其人可否於家行孝無虧於國有忠得無忘恩行積於人福善無虧不積十惡受於師授身命棄財如塵土者方可與傳受薄道之徒重財輕命者不可與傳墜於師之九祖祕之祕之吝之飬命機關金丹真訣終
