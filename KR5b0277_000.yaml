front:
  text: 養命機關金丹真訣大三第一橐籥中生天地變乾坤日月星辰此是溟涬混源清濁黑白為一乃從黑生白濁中起清清者是陽為天是命濁者是隂為地是性從一生二方生中和為之正氣立人之根源從氣而生血血化為精精轉氣運便生榮衛榮衛相兼乃入真道也其蒂繫得共一也苐二橐籥者名曰胞圓如雞子上連蒂蒂上有兩弦粗細如線左主於精右主於溺續命乃生於氣引精而成髓髓變於肌膚肌者為膏膚者為血膏為氣為液血成津津液入尾閭有三竅左竅主引於精右竅主引於血中以行氣引於精精引於血血化為精精者是人之性命基本按隂符經云三盜既宜三才既安第三上宫者腦神門閉烹嗽於液液者於舌下有三竅下應尾閭關三竅者左者名曰日魂為金關右者名曰月魄為玉戶中者名曰玉泉萬神所會之門戶名為玉關玉關潤即氣以流轉玉關燥即體以枯悴修養之機要以烹嗽咽液歸於下源化為金津方生血血化精乃得氣順左右轉通入於橐籥從橐籥中返過於尾閭乃會幽闕幽闕者是兩腎中也第四幽闕前名曰黃庭其精氣血從腎而運轉至於臍臍者萬神會之庭其精氣血從尾閭關返上却以先左轉朝於黃元君是木之祖乃成鉛也第五從黃庭却右旋返歸幽闕入中幽庭其精氣血得於土從土合為一名曰一氣是初九之位方生於黑乃名鉛鉛者是隂中之陽外黑者是錫白者是金此是水中金也第六其鉛中金從幽庭逆行幽庭者應於北方所以謂之坎男迤漸逆行上歸崑崙項有金鎖關未透須用掣擺候金鎖關開其兩扇方始得朝白元君其鉛中金却化變為真精名曰魂也是木中之氣其氣經於中池入於隂位乃成汞也第七鉛入中池乃化成汞也中池者泥丸也其中有神名曰白元君是腦髓之神鉛曰魂鉛中白金者為之朱兒朱兒者是木之孫火之子是陽中之隂朱中出水銀乃名朱兒朱兒者姹女是也又為月魄是水之氣也乃見二儀也第八汞從泥丸中池流轉左右飛伏是水之真氣其數三如其薄霧乃透上崑崙入於阿耨池中流轉阿耨池者名曰紫微宫內有神號曰崑崙主紫雲君是百神之主乃將鉛汞為左日右月轉行晝夜照耀洞房從於前是木數五也第九木之真氣既備為日晶合甲位內承肝王在寅而左旋來赴玄冥在眉一寸玄冥洞房是純陽之氣已現青色有如輪覆於頂有似紫霧光輝令人髮潤如新浴此是尾閭關運行左道返於崑崙也第十水之真氣既備為月華合庚位內承肺王在申而右轉來赴玄冥在眉間一寸二分名曰玉室見純隂之氣已現白色華蓋於頂令人面白恱澤常有光容宛如冰結此是中和之氣從尾閭關轉行右道返於崑崙也第十一日魂者木之正氣為鉛為龍月魄者是水中之正氣為汞為虎水生木木生火火生土土生金為金丹也第十二鉛汞相合如春雪在洞房玉室內象如日月晝夜循環乃透下盧門盧門者是鼻中有兩竅其中和正氣從洞房玉室透下入重樓十二環至玉臺須是閉口飲玉池之津其丹得津方過重樓所以綿綿若存不入內不出外方度十二鐶下到絳宫朝於帝主帝主者心也此是離宫藏真水也第十三鉛汞相合來至絳宫順流而行氣海從氣海流入血海血海流入精海精海轉入髓海髓海者是臍也臍相對是幽闕中間是黃庭其中有一君名曰黃元君也其鉛汞到黃庭內見黃元君方始見其主也黃元君者真土是也第十四鉛汞相合至黃庭內得其真土迤漸至於臍下一寸名曰神室其中有神龜飲其精氣為物魂乃成流珠也第十五鉛汞化成流珠神龜吐納流轉至神室下二寸名曰蘭臺紫府其中有一室名曰玉室室中有鼎狀如壷上方下圓上下水火名曰既濟鼎左有日右有月日者龍也月者虎也鉛汞入鼎乃生於根要其津澆溉生芽謂之黃芽也方成一變是第一轉也第十六黃芽者是鉛汞之根基中和正氣之本金木相尅龍虎相吞鉛化為嬰兒汞變成姹女如月初三日初現於庚地水之正氣初生此是坎戶含花方隱正金也方成二變謂之二氣是第二轉也第十七二氣者日晶月華龍虎之象閉息納津運行下元正氣入鼎了變如雞𡖉某中有丹外白裏黃水火相刑如月五日現於丁此是壬火也其丹在鼎如薄冰此名三變謂之神符白雪是苐三轉也第十八神符白雪者是嬰兒為陽姹女屬隂隂陽正氣相結未成男女其丹於鼎中却化成流珠但用閉息引正氣鼎中作聲如雷再以凝結作塊以象谷神現於四色如月八日在子午相對尅伏水火謂之四神丹此名四變是第四轉也第十九四神者是黑鉛中烹鍊出白銀珠中燒成真汞白金是精精者是真水火水數一火數二下元真氣結成白馬牙用河車運載中和之氣流轉丹田循環石室此名白馬牙是第五轉也第二十白馬牙者汞結成寶在丹田中如一珠之芽色如春雪用河車搬運入中宫下黃庭之正氣歸於下丹田其牙變色如菊花之色自於腦神閉口飲津味如粟香如橘名曰刀圭又曰河車此名六變是第六轉也第二十一刀圭者是黃庭正氣但以存想閉息飲咽玉泉之漿引行中和之正氣某津甘美亦曰環漿又曰玉液如月之望也十五日乾三成其刀圭化色赤似一小山在丹田中有一神人名曰丹陽霞質常守寶山號曰靈砂是第七轉也第二十二靈砂者是鉛汞結成寶為七返丹就在鼎中不動如山鎮於下丹田敗散隂氣以成純陽其丹色如雞冠上有珠連連相聮此名八變是第八轉也第二十三七返砂者是真氣成作嬰兒是真性也以通其靈時來於臍中動上返朝於帝主流轉遍身返老還童髮白再黑丹運周天之數足名曰還丹入於中丹田絳宫之內降於三尸入於九城之內自得三魂七魄之神常來朝現道者之前此名九變是九轉也第二十四九還丹就真性常存日度三關循環九宮之內三田者每田中有三宫三三如九九宮有三殿其中者有主部轄諸神與童不離於體方可長生久視名曰真人也第二十五上丹田者是頭也後為泥丸宮內有白元君主於此宮管腦神六人童子七人腦神名為天父天母亦曰道父道母泥丸上中頂為紫微宮又曰崑崙宫其中有帝君號曰帝釋部轄七十二神童子二十四人此曰真人也泥丸相對前面名曰玄冥宫其中洞房主管八十一神三十六童子名曰玄冥也此是上丹田三宮其丹返上來朝謂之七返人天也第二十六中丹田者心也上一寸有一宫名曰蓮花宫其中有主名曰師父師母管神一百二十童子三十六人各著錦丹之衣披玉羅之帔其丹到此宫變紫赤名曰懸珠來還中宫其宫名曰絳宫其中有主名曰赤帝君各著朱衣赤幘管火神三百六十赤衣童子六十四人其宫主管飲醍醐謂之曰金津心下一寸名曰關元宫其中有主名曰龍帝管神三百四十有童子四十九人各著五彩之衣某宫主常飲雲牙津液謂之五老雲牙也第二十七下丹田者是臍下三寸謂之丹田有三宫臍下一寸名曰玄元其中有主名曰尉庭公管神四百二人童子一百二十人各著青羅衣帔其中主常飲中山仙酒令六神助護鎮定石室之中謂之曰金丹禽餐為鳯蛇餌成龍謂之金丹也第二十八仙人者已積黑氣自成其真謂之曰真人朝守三一暮轉五行烹津嗽液閉口屈舌但以絶於五榖常行體暢抱養其丹存神想氣兀兀而行四時引轉其氣流轉遍身常行沐浴血化為白膏通身透體滑澤瑩明始乃九還功畢謂之曰大還丹也第二十九紫青黃日夜念此氣自成雲力加數倍行如奔馬永除憂慮全要堅心志守清間其呪曰龍虎真丹下流到此宫色紫青黃聚則為七寶散則成珠灌度二十四節應二十四氣聚為七寶分於十二上六成陽下六為隂謂之乾坤乾者是天是父是陽謂之金坤者是地是毋是隂是土謂之九還也臍下二寸名曰黃庭內宫其中有主名曰黃元君管神四百八十四人童子一百八人各著黃衣黃幘其宫主常飲日魂其津灌溉靈根臍下三寸是曰丹田其宫名曰蘭臺宫某中有宫主名曰金公管神七百二十人童子二百四人各著絳銷金縷之衣其宫中蠕蠕不動朝餐元和之氣渴飲華池之漿變成紫金丹呪曰肝神合明腎神育嬰上魂胎光中魂爽靈下魂幽精七魄尸狗伏矢雀隂吞賊蜚毒除穢臰肺急急如律令
